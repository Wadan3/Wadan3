name: Auto Update README & Keep Graph Green

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:  
          fetch-depth: 0 

      - name: Update README timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if grep -q "" README.md; then
            sed -i "//,//c\\nLast updated: $DATE\n" README.md
          else
            echo -e "\n\nLast updated: $DATE\n" >> README.md
          fi

      - name: Commit and Push changes
        run: |
          git config user.name "Wadan3"
          git config user.email "vadanmosawer@gmail.com"

          git add README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Auto-update README timestamp"
            git push origin main
          else
            echo "No changes to commit"
          fi
