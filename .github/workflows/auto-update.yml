name: Auto Update README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # اجرای خودکار هر روز ساعت 00:00 UTC

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      #  1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      #  2: Update README timestamp
      - name: Update README timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          if grep -q "<!-- LAST_UPDATED_START -->" README.md; then
            sed -i "/<!-- LAST_UPDATED_START -->/,/<!-- LAST_UPDATED_END -->/c\\<!-- LAST_UPDATED_START -->\nLast updated: $DATE\n<!-- LAST_UPDATED_END -->" README.md
          else
            echo "" >> README.md
            echo "<!-- LAST_UPDATED_START -->" >> README.md
            echo "Last updated: $DATE" >> README.md
            echo "<!-- LAST_UPDATED_END -->" >> README.md
          fi

      - name: Commit changes
        run: |
          git config user.name "Wadan3"
          git config user.email "vadarmosawer@gmail.com"

          git add README.md
          git commit -m "Update README timestamp automatically" || echo "No changes to commit"
          git push origin main
